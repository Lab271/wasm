[project]
name = "duckhunt-server"
version = "0.1.0"
description = "FastAPI backend serving the Duck Hunt WASM game and its high scores"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckhunt_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=duckhunt_server --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
